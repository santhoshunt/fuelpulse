# jdk.net.unixdomain.tmpdir works around Selector.open failing when the JDK's
# unix-domain socket pipe lands in the default user temp dir on this machine.
# 3G heap / 1G metaspace, down from the template's 8G/4G: this machine runs
# near its Windows commit limit, and the oversized daemon kept dying with a
# native OOM mid-build ("Gradle build daemon disappeared unexpectedly").
# The Kotlin daemon gets its own capped 1G heap for the same reason.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djdk.net.unixdomain.tmpdir=D:/tmp
kotlin.daemon.jvmargs=-Xmx1G -Djdk.net.unixdomain.tmpdir=D:/tmp
android.useAndroidX=true
# Kotlin incremental compilation breaks when the pub cache (C:) and project (D:)
# are on different drives; disable it.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
