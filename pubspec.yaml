name: fuelpulse
description: "FuelPulse — Offline fuel fill-up tracker with km/L efficiency and brand comparison."
publish_to: 'none'
version: 3.2.0+13

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.0
  shared_preferences: ^2.2.0
  intl: ^0.19.0
  csv: ^6.0.0
  share_plus: ^12.0.2
  file_picker: ^10.1.0
  path_provider: ^2.1.0
  # Google Drive backup. Pinned to the 6.x google_sign_in API surface
  # (constructor + signIn/signInSilently + authenticatedClient extension) —
  # 7.x replaced it with a singleton/authorization-client model and the
  # Drive service is written against 6.x, mirroring the expense tracker.
  google_sign_in: ^6.2.0
  googleapis: ^12.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.0
  # In-app updater (ported from the expense tracker): GitHub release list and
  # APK download, plus the release-page fallback link. The app version comes
  # from the update method channel, not package_info_plus, whose 10.x needs
  # win32 6 while the plugins above resolve win32 5.
  http: ^1.2.0
  url_launcher: ^6.3.0
  google_mlkit_text_recognition: 1.0.1
  image_picker: 1.2.4
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.29.0

flutter:
  uses-material-design: true
  assets:
    # Brand logos for the six known pump brands. Indian Oil, Bharat
    # Petroleum and HP are public-domain files from Wikimedia Commons; the
    # others identify the brand only.
    - assets/brand_logos/
