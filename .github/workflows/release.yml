name: Release

on:
  push:
    tags: ['v*']
  # A manual run from main builds, tests and verifies the APKs, then uploads
  # them as a workflow artifact instead of publishing a release, so changes
  # to this file can be tried before a real tag.
  workflow_dispatch:

permissions:
  contents: write # create the release and upload assets

jobs:
  build-and-release:
    # Pinned, not ubuntu-latest: v1.3.0 shipped from 24.04, and a release can
    # only be tested by pushing a tag. Move here and in ci.yml together.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17' # AGP 9 needs JDK 17+; matches the local jdk-17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      # The committed android/gradle.properties carries workarounds for the
      # dev machine (a Windows-only unix-socket tmpdir and tight heap caps).
      # User-home properties take precedence over project ones, so this
      # neutralizes them on the runner without touching the repo file.
      - name: Override machine-specific Gradle properties
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
          kotlin.daemon.jvmargs=-Xmx2G
          EOF

      - name: Restore release keystore
        run: printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/fuelpulse.jks
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=fuelpulse.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=fuelpulse
          EOF

      # The in-app updater shows the release body as the update's notes, so
      # a tagged release must bring its own instead of the near-empty
      # generated ones.
      # Guards test the event as well as the ref: the "Run workflow" dialog
      # can be pointed at a tag, and a manual run must never publish.
      - name: Require release notes for the tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          test -s "release-notes/${GITHUB_REF_NAME}.md" || {
            echo "::error::Missing release-notes/${GITHUB_REF_NAME}.md"
            exit 1
          }

      - run: flutter pub get
      - run: flutter test # never ship a red build
      - run: flutter build apk --release --split-per-abi

      # The gradle script silently falls back to debug signing when
      # key.properties is unusable (e.g. a typo'd secret). Fail loudly instead
      # of publishing a debug-signed "release". APKs carry v2+ signatures that
      # keytool cannot read, so this must be apksigner.
      - name: Verify release signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -q 'CN=FuelPulse'

      - uses: softprops/action-gh-release@v3
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          files: build/app/outputs/flutter-apk/app-*-release.apk
          body_path: release-notes/${{ github.ref_name }}.md
          generate_release_notes: true # appends the changelog link

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: fuelpulse-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 3
